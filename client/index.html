<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="PzwtNk0VyIVurT49DwFGc4gwJWvPulWq1MkbxZJzphQ" />
    <title>Remind Me</title>

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/png" href="/image.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />

    <!-- PWA & Mobile Display Settings -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RemindMe" />

    <!-- Apply saved theme before first paint (no flash). Keep keys in sync with src/theme/ThemeContext.jsx -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("remindme-color-mode");
          if (mode !== "light" && mode !== "dark") {
            mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var style = localStorage.getItem("remindme-theme-style") === "minimal" ? "minimal" : "classic";
          var root = document.documentElement;
          if (mode === "dark") root.classList.add("dark");
          root.setAttribute("data-theme", style);
          var colors = { "classic-light": "#ffffff", "classic-dark": "#0f1117", "minimal-light": "#fafafa", "minimal-dark": "#0a0a0a" };
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", colors[style + "-" + mode]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
