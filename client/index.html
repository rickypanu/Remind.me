<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google-site-verification" content="PzwtNk0VyIVurT49DwFGc4gwJWvPulWq1MkbxZJzphQ" />
    <title>RemindMe: Specific, Daily &amp; Weekly Reminders</title>
    <meta
      name="description"
      content="RemindMe sends specific, daily and weekly reminders to Telegram and your browser. Type or speak a task, and never miss a deadline or habit again."
    />
    <meta name="robots" content="index, follow" />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RemindMe" />
    <meta property="og:title" content="RemindMe: Specific, Daily &amp; Weekly Reminders" />
    <meta
      property="og:description"
      content="Specific, daily and weekly reminders delivered to Telegram and your browser."
    />
    <meta property="og:image" content="/screenshot-desktop.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RemindMe: Specific, Daily &amp; Weekly Reminders" />
    <meta
      name="twitter:description"
      content="Specific, daily and weekly reminders delivered to Telegram and your browser."
    />

    <!-- Icons & Manifest -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts (loaded once here instead of an @import inside the page) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap"
    />

    <!-- PWA & Mobile Display Settings -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RemindMe" />

    <!-- Apply saved theme before first paint (no flash). Keep keys in sync with src/theme/ThemeContext.jsx -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("remindme-color-mode");
          if (mode !== "light" && mode !== "dark") {
            mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var style = localStorage.getItem("remindme-theme-style") === "minimal" ? "minimal" : "classic";
          var root = document.documentElement;
          if (mode === "dark") root.classList.add("dark");
          root.setAttribute("data-theme", style);
          var colors = { "classic-light": "#ffffff", "classic-dark": "#0f1117", "minimal-light": "#fafafa", "minimal-dark": "#0a0a0a" };
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", colors[style + "-" + mode]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
