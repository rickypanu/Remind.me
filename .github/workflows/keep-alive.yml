# Keeps the free Render API awake so the first reminder you add (and every scheduled notification) is never
# waiting for a cold start. Free: GitHub Actions minutes are unlimited for public repos.
#
# Setup (one time): GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables tab ->
# New repository variable   API_URL = https://<your-service>.onrender.com   (no trailing slash)
#
# GitHub may delay scheduled runs by a few minutes under load, so ALSO add a free UptimeRobot monitor
# (see DEPLOY_FREE.md, "Keep the server awake"). Using both is the most reliable.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes; Render free sleeps after 15 quiet minutes
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "Set the API_URL repository variable"; exit 1; fi
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -m 60 -w "%{http_code}" "$API_URL/health" || true)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          exit 1
