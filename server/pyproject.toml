[project]
name = "remindme-api"
version = "1.0.0"
description = "RemindMe backend: FastAPI + MongoDB reminder service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "python-multipart>=0.0.18,<1",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "pymongo>=4.13,<5",
    "argon2-cffi>=23.1,<27",
    "bcrypt>=4.2,<6",
    "PyJWT[crypto]>=2.9,<3",
    "cryptography>=44.0.1,<50",
    "slowapi>=0.1.9,<0.2",
    "redis>=5.2,<8",
    "apscheduler>=3.10,<4",
    "httpx>=0.27,<1",
    "google-genai>=1.0,<2",
    "pywebpush>=2.0,<3",
    "pillow>=11.0,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5.0,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pip-audit>=2.7,<3",
    "pre-commit>=4.0,<5",
]

# ----------------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["app", "utils", "schemas"]
branch = true

# ----------------------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["__pycache__", "venv", ".venv"]

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I imports, B bugbear, UP pyupgrade, S bandit (security),
# ASYNC blocking calls in async code, T20 no print(), DTZ no naive datetimes.
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "T20", "DTZ"]
ignore = [
    "B008",  # FastAPI's Depends(...) in argument defaults is the framework's pattern
    # `class Outcome(str, Enum)` -> StrEnum would change str(Outcome.SENT) from "Outcome.SENT" to "sent", which log
    # lines and JSON payloads may depend on. Revisit when those uses are audited.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# assert, fake secrets, seeded random numbers, sha1 for a fake ObjectId and long assertion lines are fine in tests
"tests/**" = ["S101", "S105", "S106", "S311", "S324", "T20", "B017", "E501"]
"scripts/**" = ["T20"]
# False positives: setting / constant NAMES that contain "password" or "token" (the values are rate limits, a regex,
# the literal "bearer" and "access"), not secrets.
"app/core/config.py" = ["S105"]
"app/services/telegram_linking.py" = ["S105"]
"schemas/auth.py" = ["S105"]
"utils/security.py" = ["S105"]
# Prose-heavy modules kept as they were written (long prompt / message lines). Wrap them when next edited.
"app/services/quick_add.py" = ["E501"]
"app/notifications/messages.py" = ["E501", "S311"]  # S311: random.choice picks a notification wording, not a secret
"utils/gemini_pool.py" = ["E501"]
"utils/recurrence.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "schemas", "utils", "scripts", "tests"]

# ----------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
